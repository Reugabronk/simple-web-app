<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn Moderne App</title>
    <!-- Tailwind CSS via CDN voor een moderne look -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100">
        <div class="mb-8">
            <h1 class="text-2xl font-bold text-slate-900">Welkom bij mijn App</h1>
            <p class="text-slate-500 text-sm">Typ iets hieronder en klik op de knop.</p>
        </div>
        
        <form method="POST" class="space-y-4">
            <div>
                <label for="user_text" class="block text-sm font-medium text-slate-700 mb-1">Bericht</label>
                <input 
                    type="text" 
                    id="user_text" 
                    name="user_text" 
                    placeholder="Bijvoorbeeld: Hallo wereld!" 
                    required
                    class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all"
                >
            </div>
            <button 
                type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition-colors shadow-md active:transform active:scale-[0.98]"
            >
                Versturen
            </button>
        </form>

        {% if result %}
            <div class="mt-8 p-4 bg-blue-50 border border-blue-100 rounded-lg">
                <p class="text-sm text-blue-800">
                    <span class="font-bold">Resultaat:</span> {{ result }}
                </p>
            </div>
        {% endif %}
    </div>
</body>
</html>
